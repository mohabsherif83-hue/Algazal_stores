services:
  - type: web
    name: alghazal-stores
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PRODUCTS_FILE
        value: /var/data/products.json
    disk:
      name: alghazal-products
      mountPath: /var/data
      sizeGB: 1
